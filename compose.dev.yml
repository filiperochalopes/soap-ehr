name: soap-ehr

services:
  soap-ehr-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SOAP_EHR_DB_NAME:-soap_ehr}
      POSTGRES_USER: ${DB_USER:-clinic}
      POSTGRES_PASSWORD: ${DB_PASS:-clinic}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clinic} -d ${SOAP_EHR_DB_NAME:-soap_ehr}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  soap-ehr-omop-init:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      soap-ehr-db:
        condition: service_healthy
    environment:
      OMOP_DB_HOST: soap-ehr-db
      OMOP_DB_NAME: ${SOAP_EHR_DB_NAME:-soap_ehr}
      OMOP_DB_USER: ${DB_USER:-clinic}
      PGPASSWORD: ${DB_PASS:-clinic}
    entrypoint: ["/bin/sh", "/scripts/ensure-omop-schema.sh"]
    volumes:
      - ./scripts/ensure-omop-schema.sh:/scripts/ensure-omop-schema.sh:ro
      - ./omop/schema:/omop:ro

  soap-ehr:
    build:
      context: .
      target: deps
    depends_on:
      soap-ehr-db:
        condition: service_healthy
    command: sh ./scripts/dev-with-prisma.sh
    env_file:
      - .env
    extra_hosts:
      - "meuexame.localhost:192.168.65.254"
    networks:
      default:
      development:
        aliases:
          - fhir-soap-record
    environment:
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      OMOP_DATABASE_URL: ${OMOP_DATABASE_URL:?OMOP_DATABASE_URL must be set}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  default:
  development:
    external: true
