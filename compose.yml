name: soap-ehr

services:
  soap-ehr-db-legacy:
    profiles: ["legacy", "migration"]
    image: mysql:8.4
    container_name: soap-ehr-db-legacy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - data
    environment:
      MYSQL_DATABASE: ${V1_DB_NAME:-fhir_soap_record}
      MYSQL_ROOT_PASSWORD: ${LEGACY_DB_PASS:-${DB_PASS:-clinic}}
      MYSQL_USER: ${LEGACY_DB_USER:-clinic}
      MYSQL_PASSWORD: ${LEGACY_DB_PASS:-${DB_PASS:-clinic}}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${LEGACY_DB_PASS:-${DB_PASS:-clinic}}"]
      # Matches the production V1 database setting and avoids unnecessary probes
      # while the retained legacy source is only used during migration.
      interval: 60s
      timeout: 5s
      retries: 10
    ports:
      - "${LEGACY_DB_PORT:-3306}:3306"
    # Preserve the existing MySQL files while the renamed service becomes
    # read-only/stale after production cutover.
    volumes:
      - ./data/db:/var/lib/mysql

  soap-ehr-db-legacy-init:
    profiles: ["legacy", "migration"]
    image: mysql:8.4
    restart: "no"
    networks:
      - data
    depends_on:
      soap-ehr-db-legacy:
        condition: service_healthy
    environment:
      DB_HOST: soap-ehr-db-legacy
      DB_ROOT_PASSWORD: ${LEGACY_DB_PASS:-${DB_PASS:-clinic}}
      DB_USER: ${LEGACY_DB_USER:-clinic}
      MYSQL_PWD: ${LEGACY_DB_PASS:-${DB_PASS:-clinic}}
      V1_DB_NAME: ${V1_DB_NAME:-fhir_soap_record}
    entrypoint: ["/bin/sh", "/scripts/ensure-v1-legacy-database.sh"]
    volumes:
      - ./scripts/ensure-v1-legacy-database.sh:/scripts/ensure-v1-legacy-database.sh:ro

  soap-ehr-db:
    image: postgres:17-alpine
    container_name: soap-ehr-db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - data
    environment:
      POSTGRES_DB: ${SOAP_EHR_DB_NAME:-soap_ehr}
      POSTGRES_USER: ${DB_USER:-clinic}
      POSTGRES_PASSWORD: ${DB_PASS:-clinic}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clinic} -d ${SOAP_EHR_DB_NAME:-soap_ehr}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT:-5438}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  soap-ehr-omop-init:
    profiles: ["omop", "migration"]
    image: postgres:17-alpine
    restart: "no"
    networks:
      - data
    depends_on:
      soap-ehr-db:
        condition: service_healthy
    environment:
      OMOP_DB_HOST: soap-ehr-db
      OMOP_DB_NAME: ${SOAP_EHR_DB_NAME:-soap_ehr}
      OMOP_DB_USER: ${DB_USER:-clinic}
      PGPASSWORD: ${DB_PASS:-clinic}
    entrypoint: ["/bin/sh", "/scripts/ensure-omop-schema.sh"]
    volumes:
      - ./scripts/ensure-omop-schema.sh:/scripts/ensure-omop-schema.sh:ro
      - ./omop/schema:/omop:ro

  soap-ehr-migration:
    profiles: ["migration"]
    build:
      context: .
      target: migration
    networks:
      - data
    depends_on:
      soap-ehr-db-legacy-init:
        condition: service_completed_successfully
      soap-ehr-db:
        condition: service_healthy
      soap-ehr-omop-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      OMOP_DATABASE_URL: ${OMOP_DATABASE_URL:?OMOP_DATABASE_URL must be set}
      V1_DATABASE_URL: ${V1_DATABASE_URL:?V1_DATABASE_URL must be set}

  soap-ehr:
    build:
      context: .
    container_name: soap-ehr
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - proxy
      - internal
      - data
    depends_on:
      soap-ehr-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      OMOP_DATABASE_URL: ${OMOP_DATABASE_URL:?OMOP_DATABASE_URL must be set}
      V1_DATABASE_URL: ${V1_DATABASE_URL:?V1_DATABASE_URL must be set}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_DRY_RUN: ${API_DRY_RUN:-false}
      COOKIE_NAME: clinic_token
      PORT: 3000
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-20250514}
      LLM_TOKEN: ${LLM_TOKEN:-}
      MCP_CALC_URL: ${MCP_CALC_URL:-http://beta.calc.filipelopes.med.br/mcp}
      MEUEXAME_API_BASE_URL: ${MEUEXAME_API_BASE_URL:-}
      DOCS_APP_BASE_URL: ${DOCS_APP_BASE_URL:-}
      DOCS_WEBHOOK_BASE_URL: ${DOCS_WEBHOOK_BASE_URL:-}
      PLUGIN_SECRET_ENCRYPTION_KEY: ${PLUGIN_SECRET_ENCRYPTION_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      ATTACHMENT_PDF_COMPRESSION: ${ATTACHMENT_PDF_COMPRESSION:-200dpi}
      PATIENT_SEARCH_MAX_EDITS: ${PATIENT_SEARCH_MAX_EDITS:-2}
    ports:
      - "${APP_PORT:-3000}:3000"

networks:
  proxy:
    external: true
  internal:
    external: true
  data:
    external: true
